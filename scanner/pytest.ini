[pytest]
# Configuration globale
minversion = 7.0
testpaths = tests
addopts = -v --tb=short --strict-markers --strict-config

# Personnalisation de la découverte des tests
python_files = test_*.py *_test.py
python_classes = Test* *Suite
python_functions = test_*



# Enregistrement des marqueurs
markers =
    slow : marks tests as slow.
    fast : marks tests as slow .
    integration : marks integration tests.
    unit : marks unit tests.
    excutor : marks excutor tests.



# Gestion des alertes et warnings
filterwarnings =
    error
    ignore::DeprecationWarning:pkg_resources.*

# Configuration des logs en temps réel dans la console
log_cli = true
log_cli_level = DEBUG
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
