# Scanner API on an AWS EC2 server, behind Caddy (automatic HTTPS).
# Started by setup.sh — see DEPLOY.md. Settings come from ./.env (created by setup.sh).
services:
  scanner:
    build:
      context: ../../scanner
      dockerfile: dockerfile
    image: auto-pentest-scanner:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_NAME: scanner
      NMAP_TOP_PORTS: "1000"
      NMAP_TIMING: "-T4"
      # Nuclei settings are sized to the server's RAM by tune.sh (run by
      # setup.sh / update.sh), which writes them into .env. The defaults below
      # are the safe values for a 1 GB server.
      # An empty NUCLEI_TAGS means "full template set".
      NUCLEI_TAGS: ${NUCLEI_TAGS-cve,misconfig,exposure,xss,sqli,lfi,rce,ssrf,redirect,takeover,default-login}
      NUCLEI_SEVERITY: ${NUCLEI_SEVERITY:-critical,high,medium,low}
      NUCLEI_EXTRA_ARGS: ${NUCLEI_EXTRA_ARGS:--c 5 -bs 5 -rl 50}
      NUCLEI_TIMEOUT: ${NUCLEI_TIMEOUT:-600}
      # Soft memory limit for the Go tools (nuclei, katana, httpx, subfinder).
      GOMEMLIMIT: ${GOMEMLIMIT:-300MiB}
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?run setup.sh first}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - scanner

volumes:
  caddy_data:
  caddy_config:
